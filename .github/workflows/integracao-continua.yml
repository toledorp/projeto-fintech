name: Fintech CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Validação e compilação do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run build

  docker:
    name: Build Docker do backend
    needs: backend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fintech-backend:ci ./backend

  deploy-render:
    name: Acionar deploy no Render
    needs: [backend-ci, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Enviar deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOOK_URL" ]]; then
            echo "::error::O segredo RENDER_DEPLOY_HOOK_URL não está configurado."
            exit 1
          fi
          separator='?'
          [[ "$DEPLOY_HOOK_URL" == *'?'* ]] && separator='&'
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --connect-timeout 10 --max-time 30 \
            "${DEPLOY_HOOK_URL}${separator}ref=${DEPLOY_COMMIT}" 2>/dev/null); then
            echo "::error::Falha ao conectar ao deploy hook do Render."
            exit 1
          fi
          if [[ "$status" != 200 && "$status" != 201 ]]; then
            echo "::error::Deploy hook retornou HTTP $status."
            exit 1
          fi
          echo "Deploy solicitado ao Render (HTTP $status)."

  qualidade-backend:
    name: Qualidade e testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test:run

  frontend:
    name: Build e Docker do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar frontend quando presente
        shell: bash
        run: |
          if [ -d app ]; then
            cd app
            pnpm install --frozen-lockfile
            pnpm run build
            docker build -t app-service:test .
          fi
